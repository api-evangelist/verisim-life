aid: verisim-life
name: VeriSIM Life
description: 'VeriSIM Life is an AI-driven drug discovery and development company that
  applies mechanistic artificial intelligence and quantitative simulation to reduce the
  cost, time, and failure rate of translating drug candidates into clinical trials. Its
  BIOiSIM platform is a biosimulation decision engine that can screen large libraries of
  drug-like compounds and run simulation scenarios across species and dosing regimens,
  while AtlasGEN designs novel molecules and evaluates them for safety and efficacy. The
  company operates PulmoSIM Therapeutics as a subsidiary. VeriSIM Life exposes no public
  developer API, SDK, or developer portal; the platform is accessed through partnerships
  and demos. This profile is maintained in the API Evangelist network for discovery and
  monitoring.'
